<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nomad Map | Live</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- PapaParse for CSV -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <!-- Leaflet Map CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Inter Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        /* Map Popup Styling */
        .leaflet-popup-content-wrapper { border-radius: 1rem; padding: 0; overflow: hidden; box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1); }
        .leaflet-popup-content { margin: 0; width: 240px !important; }
        .leaflet-popup-content p { margin: 0; }
        .custom-popup img { width: 100%; height: 140px; object-fit: cover; }
        .custom-popup .p-4 { padding: 16px; }
        .leaflet-container a.leaflet-popup-close-button { color: white; text-shadow: 0 1px 3px black; padding: 8px; }
        /* Hide scrollbar for grid */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="bg-gray-50 h-screen flex flex-col overflow-hidden relative">

    <!-- Floating Top Navigation (Glassmorphism) -->
    <nav class="absolute top-0 w-full z-[500] px-4 py-4 pointer-events-none">
        <div class="max-w-7xl mx-auto flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
            
            <!-- Logo & Live Indicator -->
            <div class="bg-white/90 backdrop-blur-md shadow-lg border border-gray-100 rounded-full px-5 py-2.5 flex items-center gap-3 pointer-events-auto">
                <span class="text-2xl">🌍</span>
                <h1 class="text-lg font-bold text-gray-900 tracking-tight">Nomad Map</h1>
                <div class="h-4 w-px bg-gray-300 mx-1"></div>
                <!-- Live Ping Indicator -->
                <div class="flex items-center gap-1.5" title="Auto-syncing with Google Sheets">
                    <span class="relative flex h-2.5 w-2.5">
                      <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
                      <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-green-500"></span>
                    </span>
                    <span class="text-xs font-semibold text-gray-500 uppercase tracking-wider">Live</span>
                </div>
            </div>
            
            <!-- Controls -->
            <div class="flex items-center gap-2 pointer-events-auto bg-white/90 backdrop-blur-md shadow-lg border border-gray-100 p-1.5 rounded-2xl">
                <select id="collectionFilter" class="bg-transparent border-none text-gray-700 text-sm focus:ring-0 outline-none font-semibold cursor-pointer pl-3 pr-2 py-1.5">
                    <option value="All">All Collections</option>
                </select>
                <div class="h-6 w-px bg-gray-200 mx-1"></div>
                <div class="flex bg-gray-100 p-1 rounded-xl">
                    <button id="btnMap" class="px-4 py-1.5 rounded-lg bg-white shadow-sm text-sm font-semibold text-gray-900 transition">Map</button>
                    <button id="btnGrid" class="px-4 py-1.5 rounded-lg text-gray-500 text-sm font-semibold hover:text-gray-900 transition">List</button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content Area -->
    <main class="flex-1 relative w-full h-full">
        <!-- Initial Loading Overlay -->
        <div id="loading" class="absolute inset-0 bg-gray-50 z-[1000] flex flex-col items-center justify-center transition-opacity duration-500">
            <div class="w-12 h-12 border-4 border-blue-200 border-t-blue-600 rounded-full animate-spin mb-4"></div>
            <div class="text-lg font-semibold text-gray-800">Syncing with Google Sheets...</div>
        </div>

        <!-- Map View Container -->
        <div id="mapContainer" class="w-full h-full absolute inset-0 z-10"></div>

        <!-- Grid View Container -->
        <div id="gridContainer" class="w-full h-full absolute inset-0 z-20 bg-gray-50 hidden overflow-y-auto pt-28 px-6 pb-20">
            <div id="grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-6 max-w-7xl mx-auto">
                <!-- Cards injected here -->
            </div>
        </div>
    </main>

        // ==========================================
        const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRDk-hPe6yww4nnUXm3oSn-nKmvUlxtkXmfkKCklrhVAQSHvs_ieA1SGIPxavDLLhHeHhSSbVEv7ZEz/pub?output=csv";
        
        // Settings
        const PING_INTERVAL_MS = 15000; // Pings Google Sheets every 15 seconds

        const btnMap = document.getElementById('btnMap');
        const btnGrid = document.getElementById('btnGrid');
        const grid = document.getElementById('grid');

            attribution: '&copy; OpenStreetMap contributors',
            maxZoom: 19
        }).addTo(map);

        let previousDataHash = "";
        let mapMarkers = [];
